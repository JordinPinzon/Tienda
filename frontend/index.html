<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <h1>🛍️ Tienda</h1>
    <nav>
      <a href="#catalogo">Catálogo</a>
      <a href="#carrito">Carrito (<span id="contador">0</span>)</a>
    </nav>
  </header>

  <main class="contenido">
    <section id="catalogo">
      <h2>Catálogo</h2>
      <label for="buscar">Buscar producto</label>
      <input id="buscar" type="search" placeholder="Ej.: camiseta">

      <div id="lista-productos" class="grilla">
        <article class="tarjeta">
          <div class="emoji">👕</div>
          <h3>Camiseta</h3>
          <p class="precio">$12.50</p>
          <p class="stock">Disponibles: 20</p>
          <button class="boton">Agregar</button>
        </article>

        <article class="tarjeta">
          <div class="emoji">🧢</div>
          <h3>Gorra</h3>
          <p class="precio">$8.00</p>
          <p class="stock">Disponibles: 15</p>
          <button class="boton">Agregar</button>
        </article>

        <article class="tarjeta">
          <div class="emoji">👟</div>
          <h3>Zapatos</h3>
          <p class="precio">$45.00</p>
          <p class="stock">Disponibles: 5</p>
          <button class="boton">Agregar</button>
        </article>
      </div>
    </section>

     <aside id="carrito" class="carrito">
        <h2>Tu carrito</h2>
        <ul id="lista-carrito">
            <li>El carrito está vacío</li>
        </ul>
        <div id="resumen"></div>
        <button id="btn-confirmar" class="boton">Confirmar compra</button>
        <p id="mensaje"></p>
        </aside>


  </main>

 <footer class="pie">
   <p>Programación Básica &amp; Desarrollo Web con MVC · Clase 2</p>
 </footer>


  <script src="js/app.js"></script>
</body>
</html>
